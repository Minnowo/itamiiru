# Default settings, colors, menus and actions.
# Generate using `itami --write-config`.
#
# config files are:
# ~/.config/itamiiru/config.toml
# ~/.config/itamiiru/live.toml
#
# itamiiru never writes config.toml. It is the base config,
# all changes made in the app end up in live.toml.


# The view mode of the file list.
# ["details", "list", "medium_icons", "large_icons", "extra_large_icons"]
view = "details"

# The sort column and order of the file list.
# ["name", "modified", "created", "type", "size"]
sort_column = "name"
sort_ascending = true

# The Details view's columns after Name (order matters).
# ["modified", "created", "type", "size"]
details_columns = ["modified", "size"]

# What the status bar shows for a selected item (order matters).
# ["name", "type", "size", "modified", "created", "path"]
status_fields = ["size", "created", "modified"]

# Show files and folders whose names start with a dot.
# This also applies to hidden drives.
show_hidden = false

# The UI scaling / zoom level (1.0 is 100%).
zoom = 1.0

# The side pane's width, in points.
sidebar_width = 220

# The window's size when not maximized, in points at 100% zoom.
window_width = 900
window_height = 600
window_maximized = false

# Delete moves to the trash; false deletes permanently (after asking).
use_trash = true

# Enable drag and drop to and from other apps.
drag_and_drop = true

# Enable drag and drop onto folders, tabs, drives, and between split panes.
drag_within = true

# Drag from empty space to select with a box.
drag_select = true

# The toolbar shows Cut, Copy, Paste, Rename and Delete as icons instead of their names.
toolbar_icons = false

# Alternate row colors in detail view.
striped_rows = false

# The color theme. When set to "custom", the colors set in the config file are used.
# ["ponkotsu", "windows10", "custom"]
theme = "ponkotsu"

# Auto detect new files and drives.
# This is done by polling every x number of seconds as of right now.
auto_refresh_folder = true
auto_refresh_drives = true

# Load image previews in the icon views.
thumbnails = true

# Show the file preview pane.
preview_pane = true
preview_width = 300

# Only show the file preview pane when a file is selected and can be previewed.
preview_auto_hide = true


# Custom actions are commands for the right-click menus.
# The format goes as follows:
#
# [action.<id>]
# name    = "Menu text to show"
# command = "command to run"
# for     = ["files", "folders", "*.some_file_type"]
#
# Where:
#   <id>          is the ID used to assign the action into a menu.
#   name    = ""  is the text the menu item will show.
#
#   command = ""  is the program and its arguments, it is split like a shell.
#                 Placeholders in the command:
#                   %f  the item's path; with several selected, the command runs once per selected item
#                   %F  all selected paths, as separate arguments, run once
#                   %d  the folder: a folder itself, otherwise the one the file is in
#                   %n  the item's name
#                   %%  a percent sign
#
#                 The command is not run by a shell, so pipes (|), redirects (>), ~ and
#                 $VARS don't work in it. To use them, run sh yourself, and hand it the
#                 path as an argument after the script, where the script reads it as $1:
#                   command = "sh -c 'gzip -c \"$1\" > \"$1.gz\"' sh %f"
#                 Don't write %f inside the script itself: the path is pasted in as is,
#                 and a file named like a command would run that command.
#
#   for     = []  determines if the menu action will appear based on the selected item.
#                 If multiple items are selected, the action appears if each item matches the filter.
#                   "files"     matches any file
#                   "folders"   matches any folder
#
#                   "<pattern>" matches the pattern by item name (letter casing doesn't matter).
#                               `*`    matches zero or more characters
#                               `?`    matches one character
#                               [abc]  matches only one character in ['a', 'b', 'c']
#                               [a-z]  matches only one character in ['a', 'b', 'c', .... 'z']
#                               [!abc] matches any one character not in ['a', 'b', 'c']
#
#                   Some example patterns:
#                     "*.jpg"       names ending in ".jpg" (or ".JPG")
#                     "*.tar.*"     tar archives: "a.tar.gz", "a.tar.xz", ...
#                     "*.mp[34]"    names ending in ".mp3" or ".mp4"
#                     "IMG_????.*"  "IMG_" and four characters, then any extension
#                     "[!.]*"       names that don't start with a dot
#                     "*"           anything (like ["files", "folders"])
#
#                   Without for, the action shows for ["files", "folders"].
#
# Here are some examples:
#
# Open the a folder in the terminal:
# ```
# [action.open_terminal]
# name = "Open in terminal"
# command = "x-terminal-emulator --working-directory=%d"
# for = ["folders"]
# ```
#
# Extract zip files using 7-Zip:
# ```
# [action.extract_here]
# name = "Extract here"
# command = "7z x %f -o%d"
# for = ["*.zip", "*.7z"]
# ```
#
# Open with VSCode, for files and folders:
# ```
# [action.open_vscode]
# name = "Open with VSCode"
# command = "code %F"
# ```


# Defines right-click menus in parts of the app.
# Each menu definition contains a list of commands:
#
#   "<command-id>"                                 a built-in command or a user-defined action
#   "---"                                          a menu separator
#   { id = "<command-id>", name = "..." }          a command/action but with a custom name
#   { id = "<command-id>", for = [...] }           a command/action but with a custom filter
#   { name = "...", for = [...], items = [...] }   a submenu (which can hold more submenus)
#
# Built-in commands, and the menus they work in, and what they do:
#   open                  item, bookmark, place, drive               open a file or folder
#   open_in_new_tab       item, bookmark, place, drive               open a folder in a new tab
#   pin                   item, background, bookmark, place, drive   pin or unpin a folder from bookmarks
#   copy_path             item, background, bookmark, place, drive   copy the selected items' paths
#   cut                   item                                       cut a file or folder
#   copy                  item                                       copy a file or folder
#   paste                 item, background                           paste a file or folder
#   copy_to_other_pane    item                                       in split view, copy an item to the other panel
#   move_to_other_pane    item                                       in split view, move an item to the other panel
#   rename                item                                       rename a file or folder
#   trash                 item                                       move an item to the trash
#   delete                item                                       permanently delete an item
#   new_folder            background                                 make a new folder
#   sort_by               background                                 change the view sort column / direction
#   select_all            background                                 select all items
#   refresh               background                                 reload the file list
#   toggle_hidden         background                                 toggle hidden files
#   toggle_preview        item, background                           toggle the preview panel
#   toggle_split          item, background                           toggle split view
#   settings              item, background                           open settings
#   mount                 drive                                      mount a drive
#   unmount               drive                                      unmount a drive
#   eject                 drive                                      eject a drive
#
# Built-in commands hide or grey out by themselves when they can't be used.
#
# Here are some examples (using the custom actions from the above examples):
#
# Add 7-Zip submenu for archives and VSCode to open files/folders:
# ```
# item = [
#   "open",
#   "open_vscode",
#   { name = "7-Zip", for = ["*.zip", "*.7z"], items = ["extract_here"] },
#   "---",
#   "cut", "copy",
# ]
# ```
[menu]

# Right-click on files and folders in the file list.
# Actions run on the selection.
item = [
  "open", "open_in_new_tab", "pin",
  "---",
  "cut", "copy", "paste", "copy_path", "copy_to_other_pane", "move_to_other_pane",
  "---",
  "rename",
  "---",
  "trash", "delete",
]

# Right-click on empty space in the file list. Actions run on the folder
# on screen.
background = [
  "paste", "new_folder", "pin",
  "---",
  "sort_by", "select_all", "refresh", "toggle_hidden",
]

# Right-click on a bookmark, under Bookmarks in the side pane.
bookmark = ["open", "open_in_new_tab", "copy_path", "---", "pin"]

# Right-click on a folder under Quick access in the side pane (Home,
# Desktop, Downloads, ...), a folder on This PC, or a network place.
place = ["open", "open_in_new_tab", "copy_path"]

# Right-click on a drive, under This PC in the side pane or on the This PC
# page, mounted or not. Actions run on where it's mounted, and are greyed
# out on a drive that isn't.
drive = ["mount", "open", "open_in_new_tab", "copy_path", "---", "unmount", "eject"]


# The same menus in the file dialog (itami --pick), the one apps show for
# Open and Save. A menu left out of config.toml's [picker_menu] is the
# one here, not the one from [menu].
[picker_menu]
# Right-click on files and folders.
item = [
  "open", "pin",
  "---",
  "cut", "copy", "paste", "copy_path",
  "---",
  "rename", "trash", "delete",
]
# Right-click on empty space.
background = [
  "paste", "new_folder", "pin",
  "---",
  "sort_by", "select_all", "refresh", "toggle_hidden",
]
# Right-click on a bookmark in the side pane.
bookmark = ["open", "copy_path", "---", "pin"]
# Right-click on a Quick access folder, a folder on This PC, or a network
# place.
place = ["open", "copy_path"]
# Right-click on a drive.
drive = ["mount", "open", "copy_path", "---", "unmount", "eject"]


# The colors to use when theme = "custom".
# These follow ponkotsu role names (https://github.com/Minnowo/ponkotsu-css).
# You can generate themes via https://minnowo.github.io/ponkotsu.
#
# If <x> is a background color, then on-<x> is the foreground color for <x>.
# on-<x> should always be readable as a foreground color on <x>.
#
# Colors are "#rrggbb" or "#rrggbbaa". A role left out keeps ponkotsu's color.
# ponkotsu's CSS names work too: --color-c-primary = "#dcc496".
[colors]
# Accents: buttons, links, the selection, errors.
primary = "#dcc496"
on-primary = "#402d00"
primary-container = "#6e5c36"
on-primary-container = "#ffffff"
secondary = "#a7caec"
on-secondary = "#003351"
secondary-container = "#3f627f"
on-secondary-container = "#ffffff"
tertiary = "#e1b6fd"
on-tertiary = "#4c007b"
tertiary-container = "#734f8e"
on-tertiary-container = "#ffffff"
error = "#edbca4"
on-error = "#522305"
error-container = "#7b5642"
on-error-container = "#ffffff"
success = "#b7cdb0"
on-success = "#153714"
success-container = "#51634c"
on-success-container = "#ffffff"

# Backgrounds. surface is the window; each surface-container-N is one
# step up, for boxes inside boxes.
surface = "#2a2724"
on-surface = "#e8e1db"
on-surface-variant = "#cec5b9"
surface-container-1 = "#35322e"
surface-container-2 = "#403d39"
surface-container-3 = "#4c4944"
surface-container-4 = "#585450"
surface-container-5 = "#64605b"
surface-container-6 = "#706c67"
surface-dim = "#2a2724"
surface-bright = "#534f4b"

# Lines and borders.
outline = "#b2aa9f"
outline-variant = "#645e54"

# Tooltips and other things drawn the other way round.
inverse-surface = "#ffffff"
inverse-on-surface = "#4a4642"
inverse-primary = "#91732c"

# File-type icons and drive bars: d- is darker, l- is lighter.
pink = "#d89dbd"
on-pink = "#330c26"
d-pink = "#ba84b8"
on-d-pink = "#320836"
l-pink = "#e8bad1"
on-l-pink = "#2e1223"
red = "#e29e7b"
on-red = "#341100"
d-red = "#d2806f"
on-d-red = "#3a0a03"
l-red = "#f1bb9f"
on-l-red = "#301404"
yellow = "#c2ad67"
on-yellow = "#231b00"
d-yellow = "#bb8e41"
on-d-yellow = "#281900"
l-yellow = "#d7c690"
on-l-yellow = "#231b00"
green = "#91b889"
on-green = "#012203"
d-green = "#859f5a"
on-d-green = "#121f00"
l-green = "#b2ceaa"
on-l-green = "#0a2009"
blue = "#84b4d2"
on-blue = "#001e2d"
d-blue = "#52a0b7"
on-d-blue = "#001f27"
l-blue = "#abcbe1"
on-l-blue = "#001e2d"

# A button under the pointer (hover) or with keyboard focus (focus).
primary-hover = "#c8b083"
primary-focus = "#b49d71"
secondary-hover = "#92b6d8"
secondary-focus = "#7ea3c5"
tertiary-hover = "#cea2ed"
tertiary-focus = "#ba8ddd"
error-hover = "#d9a890"
error-focus = "#c6957c"
success-hover = "#a2ba9b"
success-focus = "#8da687"
surface-container-1-hover = "#484440"
surface-container-1-focus = "#5c5853"

# See-through tints laid over things under the pointer or focused
# (#rrggbbaa; the last two digits are the opacity).
primary-hover-tint = "#dcc4961f"
primary-focus-tint = "#dcc4963d"
secondary-hover-tint = "#a7caec1f"
secondary-focus-tint = "#a7caec3d"
tertiary-hover-tint = "#e1b6fd1f"
tertiary-focus-tint = "#e1b6fd3d"
error-hover-tint = "#edbca41f"
error-focus-tint = "#edbca43d"
success-hover-tint = "#b7cdb01f"
success-focus-tint = "#b7cdb03d"
on-surface-hover-tint = "#e8e1db1f"
on-surface-focus-tint = "#e8e1db3d"
