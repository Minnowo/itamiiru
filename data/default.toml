# itamiiru's defaults: every setting, the colors, the custom actions and
# the right-click menus. This file is built into itami;
# `itami --write-config` writes it to ~/.config/itamiiru/config.toml to
# edit (or next to it, as config.default.toml, if you already have one).
# config.toml is read when itami starts.
#
# itami never writes config.toml. What you change in the app (zoom, window
# size, the settings page) goes to live.toml next to it, which wins over
# config.toml. Delete a line from live.toml to go back to your value.
#
# Every setting is shown with its default value.

# How the file list shows files: details, list, medium_icons, large_icons,
# extra_large_icons.
view = "details"

# What the file list is sorted by: name, modified, created, type, size.
sort_column = "name"
sort_ascending = true

# Show files and folders whose names start with a dot.
show_hidden = false

# The size of everything; 1.0 is 100%.
zoom = 1.0

# The side pane's width, in points.
sidebar_width = 220

# The window's size when not maximized, in points at 100% zoom.
window_width = 900
window_height = 600
window_maximized = false

# The Details view's columns after Name, in order: modified, created,
# type, size.
details_columns = ["modified", "type", "size"]

# What the status bar shows for one selected item, in order: name, type,
# size, modified, created, path.
status_fields = ["type", "size", "modified"]

# Delete moves to the trash; false deletes permanently (after asking).
use_trash = true

# Drag files out to other apps.
drag_and_drop = true

# Drag from empty space to select with a box.
drag_select = true

# Drag files onto folders and into the other pane.
drag_within = true

# The toolbar shows Cut, Copy, Paste, Rename and Delete as icons instead
# of their names.
toolbar_icons = false

# Shade every other row of the Details view.
striped_rows = false

# The color theme: ponkotsu, windows10. [colors] below goes on top.
theme = "ponkotsu"

# Show changes to the folder on screen, and to the drives, as they happen.
auto_refresh_folder = true
auto_refresh_drives = true

# Image previews in the icon views.
thumbnails = true

# The preview pane on the right; with preview_auto_hide, only when there's
# a picture or text to show. Its width is in points.
preview_pane = false
preview_auto_hide = false
preview_width = 300

# Colors on top of the chosen theme, by ponkotsu role name
# (https://github.com/Minnowo/ponkotsu-css). ponkotsu's CSS names work
# too: --color-c-primary = "#dcc496". None by default; for example:
[colors]
# primary = "#dcc496"
# surface = "#2a2724"
# on-surface = "#e8e1db"

# Custom actions: commands for the right-click menus. Each
# [action.<id>] is one; the menus below list them by id.
#   name    = the menu text.
#   command = the program and its arguments. Split into words like a shell
#             would ("quotes" and 'quotes' keep spaces), but never run
#             through a shell, so odd file names can't run anything.
#   for     = which items it shows for (default: ["files", "folders"]):
#             "files", "folders", or name patterns like "*.jpg" (upper and
#             lower case don't matter). It shows when every item matches.
#             The items are the selection in the item menu, and the folder
#             itself in the others (the folder on screen for background,
#             the bookmark, the place, the drive).
#
# Placeholders in the command:
#   %f  the item's path; with several selected, the command runs once each
#   %F  all selected paths, as separate arguments, run once
#   %d  the folder: a folder itself, otherwise the one the file is in
#   %n  the item's name
#   %%  a percent sign
# To use a shell anyway: command = "sh -c 'some | pipeline \"$1\"' sh %f"
# (pass paths as arguments like this, never inside the quoted script).
# TOML tip: 'single quotes' need no escaping: command = 'convert %f "%f.png"'
#
# There are none by default; for example:
#
# [action.open_terminal]
# name = "Open in terminal"
# command = "x-terminal-emulator --working-directory=%d"
# for = ["folders"]
#
# [action.extract_here]
# name = "Extract here"
# command = "7z x %f -o%d"
# for = ["*.zip", "*.7z"]

# The right-click menus. Each is a list of entries:
#   "id"                         a built-in command or an action
#   "---"                        a separator
#   { id = "...", name = "..." } an entry with its own name
#   { id = "...", for = [...] }  an entry shown only for some items
#                                (instead of the action's own for)
#   { name = "...", for = [...], items = [...] }
#                                a submenu; submenus can hold submenus
# A menu in config.toml replaces the same menu here; menus left out of it
# stay as they are here. Built-in commands hide or grey out by themselves
# when they can't be used (Paste with nothing to paste, Mount on a mounted
# drive). Separators at the ends, two in a row, and submenus with nothing
# to show are left out.
#
# Built-in commands, and the menus they work in:
#   open                  item, bookmark, place, drive
#   open_in_new_tab       item (a folder), bookmark, place, drive
#   pin                   item (a folder), background, bookmark, place, drive
#                         (Pin to / Unpin from Bookmarks)
#   copy_path             item, background, bookmark, place, drive
#   cut, copy             item
#   paste                 item, background
#   copy_to_other_pane    item (split view)
#   move_to_other_pane    item (split view)
#   rename, trash, delete item (delete: permanently, after asking)
#   new_folder            background
#   sort_by               background (a submenu of columns)
#   select_all, refresh   background
#   toggle_hidden         background
#   toggle_preview        item, background
#   toggle_split          item, background
#   settings              item, background
#   mount, unmount, eject drive (removable drives)
#
# Example: a 7-Zip submenu for archives, in the item menu.
#   item = [
#     "open",
#     { name = "7-Zip", for = ["*.zip", "*.7z"], items = ["extract_here"] },
#     "---",
#     "cut", "copy",
#   ]

[menu]
# Right-click on files and folders in the file list. Actions run on the
# selection.
item = [
  "open", "open_in_new_tab", "pin",
  "---",
  "cut", "copy", "paste", "copy_path", "copy_to_other_pane", "move_to_other_pane",
  "---",
  "rename", "trash", "delete",
]
# Right-click on empty space in the file list. Actions run on the folder
# on screen.
background = [
  "paste", "new_folder", "pin",
  "---",
  "sort_by", "select_all", "refresh", "toggle_hidden",
]
# Right-click on a bookmark, under Bookmarks in the side pane.
bookmark = ["open", "open_in_new_tab", "copy_path", "---", "pin"]
# Right-click on a folder under Quick access in the side pane (Home,
# Desktop, Downloads, ...), a folder on This PC, or a network place.
place = ["open", "open_in_new_tab", "copy_path"]
# Right-click on a drive, under This PC in the side pane or on the This PC
# page, mounted or not. Actions run on where it's mounted, and are greyed
# out on a drive that isn't.
drive = ["mount", "open", "open_in_new_tab", "copy_path", "---", "unmount", "eject"]

# The same menus in the file dialog (itami --pick), the one apps show for
# Open and Save. A menu left out of config.toml's [picker_menu] is the
# one here, not the one from [menu].
[picker_menu]
# Right-click on files and folders.
item = [
  "open", "pin",
  "---",
  "cut", "copy", "paste", "copy_path",
  "---",
  "rename", "trash", "delete",
]
# Right-click on empty space.
background = [
  "paste", "new_folder", "pin",
  "---",
  "sort_by", "select_all", "refresh", "toggle_hidden",
]
# Right-click on a bookmark in the side pane.
bookmark = ["open", "copy_path", "---", "pin"]
# Right-click on a Quick access folder, a folder on This PC, or a network
# place.
place = ["open", "copy_path"]
# Right-click on a drive.
drive = ["mount", "open", "copy_path", "---", "unmount", "eject"]
