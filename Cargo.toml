[workspace]
resolver = "3"
members = ["crates/itamiiru-core", "crates/itamiiru", "crates/itamiiru-portal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# House style: functions end with an explicit `return x;`, Go-style.
needless_return = "allow"
# House style: a plain for loop is fine where clippy would suggest .find().
manual_find = "allow"
# House style: `chunks_exact(4)` reads plainer than `as_chunks::<4>()`.
chunks_exact_to_as_chunks = "allow"
