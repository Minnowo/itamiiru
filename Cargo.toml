[workspace]
resolver = "3"
members = ["crates/itamiiru-core", "crates/itamiiru", "crates/itamiiru-portal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# House style: functions end with an explicit `return x;`, Go-style.
needless_return = "allow"
