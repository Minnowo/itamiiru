[package]
name = "itamiiru-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Thumbnails (PLAN.md section 7). jpeg-decoder without its default rayon feature.
png = "0.18"
jpeg-decoder = { version = "0.3", default-features = false }
gif = { version = "0.14", default-features = false, features = ["std"] }
image-webp = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Dragging files out to other apps (XDND, platform/linux/xdnd.rs). Already
# compiled in through winit; the pure-Rust connection needs no features.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }
